<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渡臺求生記：黑水溝不相信眼淚｜動漫風格歷史生存RPG</title>
  <style>
    /* ============================================================
       動漫視覺小說 × 日系RPG 設計系統
       ============================================================ */
    :root {
      --bg-night: #0b1026;
      --bg-indigo: #171f42;
      --panel-bg: rgba(19, 27, 56, 0.94);
      --panel-soft: #1e2a54;
      --ink-black: #090d1a;
      --anime-cyan: #38bdf8;
      --anime-pink: #f43f5e;
      --anime-gold: #fbbf24;
      --anime-violet: #a855f7;
      --anime-mint: #10b981;

      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-dim: #94a3b8;

      --ssr-grad: linear-gradient(135deg, #fef08a 0%, #f59e0b 35%, #f472b6 70%, #38bdf8 100%);
      --sr-grad: linear-gradient(135deg, #d8b4fe 0%, #7e22ce 100%);
      --r-grad: linear-gradient(135deg, #7dd3fc 0%, #2563eb 100%);
      --n-grad: linear-gradient(135deg, #cbd5e1 0%, #475569 100%);
      --cursed-grad: linear-gradient(135deg, #fb7185 0%, #881337 100%);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --comic-shadow: 4px 5px 0 var(--ink-black), 0 12px 28px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.16), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(244, 63, 94, 0.14), transparent 42%),
        linear-gradient(180deg, #0d1330 0%, #090d1e 100%);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* 日系漫畫網點背景紋理 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(148, 163, 184, 0.11) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      pointer-events: none;
      z-index: 0;
    }

    /* 飄浮光點裝飾 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.08) 0%, transparent 25%);
      pointer-events: none;
      z-index: 0;
    }

    /* 全畫面特效層 */
    #screen-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
    }

    .flash-red { animation: flashAnim 0.42s ease-out; background: rgba(244, 63, 94, 0.45); }
    .flash-gold { animation: flashAnim 0.48s ease-out; background: rgba(250, 204, 21, 0.36); }
    .flash-purple { animation: flashAnim 0.45s ease-out; background: rgba(168, 85, 247, 0.42); }
    .flash-green { animation: flashAnim 0.4s ease-out; background: rgba(16, 185, 129, 0.32); }

    @keyframes flashAnim {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .shake-light { animation: shakeAnim 0.35s cubic-bezier(.36,.07,.19,.97) both; }
    .shake-heavy { animation: shakeHeavyAnim 0.5s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 2px, 0); }
      40%, 60% { transform: translate3d(5px, -2px, 0); }
    }

    @keyframes shakeHeavyAnim {
      10%, 90% { transform: translate3d(-8px, 2px, 0); }
      20%, 80% { transform: translate3d(9px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-11px, 4px, 0); }
      40%, 60% { transform: translate3d(11px, -4px, 0); }
    }

    /* 主容器 */
    #app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 14px 44px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       頂部動漫風格工具列 & 固定 RPG 狀態欄 (HUD)
       ============================================================ */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.6px;
      color: #fef08a;
      text-shadow: 2px 2px 0 var(--ink-black);
    }

    .anime-skew-pill {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 11px;
      font-weight: 900;
      border: 2px solid var(--ink-black);
      box-shadow: 2px 2px 0 var(--ink-black);
      transform: skewX(-10deg);
      border-radius: 5px;
    }
    .anime-skew-pill > span {
      display: inline-block;
      transform: skewX(10deg);
    }
    .anime-skew-pill.elem { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }
    .anime-skew-pill.junior { background: linear-gradient(135deg, #f43f5e, #be123c); color: #fff; }

    .top-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      background: linear-gradient(180deg, #253363 0%, #1a2448 100%);
      color: var(--text-main);
      border: 2.5px solid var(--ink-black);
      box-shadow: 2px 3px 0 var(--ink-black);
      border-radius: var(--radius-sm);
      padding: 6px 11px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: transform 0.08s, box-shadow 0.08s, border-color 0.15s;
    }
    .icon-btn:hover { border-color: var(--anime-cyan); }
    .icon-btn:active {
      transform: translate(1px, 2px);
      box-shadow: 1px 1px 0 var(--ink-black);
    }

    /* HUD */
    #hud-container {
      position: sticky;
      top: 8px;
      z-index: 40;
      background: rgba(15, 22, 48, 0.94);
      backdrop-filter: blur(10px);
      border: 3px solid var(--ink-black);
      outline: 2px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: var(--comic-shadow);
      display: none;
    }

    .hud-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-avatar {
      width: 62px;
      height: 62px;
      flex-shrink: 0;
      border-radius: 14px;
      border: 3px solid var(--ink-black);
      background: linear-gradient(135deg, #1e3a8a, #38bdf8);
      box-shadow: 2px 3px 0 var(--ink-black);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hud-avatar svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 640px) {
      .hud-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
      }
      .hud-avatar {
        width: 54px;
        height: 54px;
      }
    }

    .stat-box {
      background: #141c3b;
      border: 2px solid var(--ink-black);
      border-radius: 10px;
      padding: 6px 8px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-label { color: var(--text-muted); }
    .stat-val {
      font-family: "Courier New", monospace;
      font-weight: 900;
      font-size: 0.92rem;
    }

    .bar-track {
      height: 9px;
      background: #070b18;
      border-radius: 999px;
      overflow: hidden;
      border: 1.5px solid var(--ink-black);
    }

    .bar-fill {
      height: 100%;
      width: 50%;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 999px;
    }
    .bar-hp { background: linear-gradient(90deg, #e11d48, #fb7185); }
    .bar-money { background: linear-gradient(90deg, #d97706, #fde047); }
    .bar-san { background: linear-gradient(90deg, #7e22ce, #e879f9); }
    .bar-rep { background: linear-gradient(90deg, #059669, #34d399); }

    .stat-danger {
      animation: pulseDanger 0.8s infinite alternate;
      border-color: #f43f5e !important;
    }
    @keyframes pulseDanger {
      from { box-shadow: 0 0 0 rgba(244, 63, 94, 0.25); }
      to { box-shadow: 0 0 12px rgba(244, 63, 94, 0.8); }
    }

    .hud-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px dashed rgba(148, 163, 184, 0.3);
      font-size: 0.78rem;
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .mini-tag {
      background: #0f1633;
      border: 1.5px solid #334155;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mini-tag.ssr { border-color: #facc15; color: #fde047; }
    .mini-tag.sr { border-color: #c084fc; color: #e9d5ff; }
    .mini-tag.r { border-color: #60a5fa; color: #bfdbfe; }
    .mini-tag.n { border-color: #94a3b8; color: #e2e8f0; }
    .mini-tag.cursed { border-color: #fb7185; color: #fda4af; }

    .stage-badge {
      font-weight: 900;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.14);
      padding: 2px 10px;
      border-radius: 999px;
      border: 1.5px solid rgba(56, 189, 248, 0.45);
    }

    /* ============================================================
       飄字與動漫吐槽 Toast
       ============================================================ */
    #floating-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 120;
      overflow: hidden;
    }

    .float-text {
      position: absolute;
      font-family: "Courier New", "Microsoft JhengHei", monospace;
      font-weight: 900;
      font-size: 1.3rem;
      text-shadow: 2px 2px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000;
      animation: floatUpFade 1.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      white-space: nowrap;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.75); }
      20% { opacity: 1; transform: translate(-50%, -14px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -85px) scale(0.95); }
    }

    #toast-container {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 130;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(92vw, 460px);
      pointer-events: none;
    }

    .meme-toast {
      background: linear-gradient(135deg, rgba(17, 24, 52, 0.97), rgba(30, 41, 82, 0.97));
      border: 3px solid var(--anime-gold);
      box-shadow: 4px 5px 0 var(--ink-black), 0 12px 28px rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fef3c7;
      font-size: 0.92rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .meme-toast.fade-out { animation: toastOut 0.28s ease-in forwards; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-10px) scale(0.92); }
    }

    /* ============================================================
       主面板與動漫封面 Hero Banner
       ============================================================ */
    .game-panel {
      background: var(--panel-bg);
      border: 3px solid var(--ink-black);
      outline: 2px solid rgba(56, 189, 248, 0.22);
      border-radius: var(--radius-lg);
      box-shadow: var(--comic-shadow);
      padding: 18px;
      animation: panelPop 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes panelPop {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 520px) {
      .game-panel { padding: 14px 12px; }
    }

    /* 首頁封面視覺卡片 */
    .anime-cover-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      border: 3px solid var(--ink-black);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 4px 5px 0 var(--ink-black);
      background: #0b132b;
    }

    .anime-cover-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 6s ease-out;
    }

    .anime-cover-hero:hover img {
      transform: scale(1.03);
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(9, 13, 26, 0.15) 0%,
        rgba(9, 13, 26, 0.05) 45%,
        rgba(9, 13, 26, 0.88) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
    }

    .cover-top-badges {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cover-badge {
      background: rgba(9, 13, 26, 0.86);
      border: 2px solid var(--anime-gold);
      color: #fde047;
      font-size: 0.76rem;
      font-weight: 900;
      padding: 4px 11px;
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--ink-black);
    }

    .cover-badge-ep {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      border: 2px solid var(--ink-black);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      transform: skewX(-10deg);
      box-shadow: 2px 2px 0 var(--ink-black);
    }

    .cover-title-block {
      text-align: left;
    }

    .anime-main-title {
      margin: 0;
      font-size: clamp(1.7rem, 5.5vw, 2.55rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 2px;
      color: #fff;
      text-shadow:
        -2px -2px 0 var(--ink-black),
        2px -2px 0 var(--ink-black),
        -2px 2px 0 var(--ink-black),
        3px 4px 0 var(--ink-black),
        0 0 22px rgba(251, 191, 36, 0.7);
    }

    .anime-main-title .accent {
      color: #fde047;
    }

    .anime-sub-tagline {
      display: inline-block;
      margin-top: 6px;
      background: rgba(56, 189, 248, 0.92);
      color: #090d1a;
      border: 2px solid var(--ink-black);
      box-shadow: 2px 3px 0 var(--ink-black);
      padding: 3px 12px;
      border-radius: 6px;
      font-size: clamp(0.82rem, 2.6vw, 0.98rem);
      font-weight: 900;
      transform: skewX(-6deg);
    }

    /* 動漫場景圖框 */
    .scene-box {
      width: 100%;
      height: 195px;
      border-radius: var(--radius-md);
      border: 3px solid var(--ink-black);
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
      background: #0d1330;
      box-shadow: 3px 4px 0 var(--ink-black);
    }

    .scene-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scene-tag {
      position: absolute;
      top: 9px;
      left: 9px;
      background: rgba(9, 13, 26, 0.88);
      border: 2px solid var(--anime-cyan);
      color: #e0f2fe;
      font-size: 0.76rem;
      font-weight: 900;
      padding: 3px 11px;
      border-radius: 999px;
      box-shadow: 2px 2px 0 var(--ink-black);
      z-index: 2;
    }

    /* 動漫視覺小說對話框 */
    .vn-box {
      position: relative;
      background: linear-gradient(180deg, rgba(22, 32, 68, 0.95) 0%, rgba(13, 19, 43, 0.98) 100%);
      border: 3px solid var(--ink-black);
      outline: 2px solid rgba(56, 189, 248, 0.35);
      border-radius: var(--radius-md);
      padding: 18px 16px 14px;
      margin: 14px 0 16px;
      box-shadow: 3px 4px 0 var(--ink-black);
    }

    .vn-speaker {
      position: absolute;
      top: -14px;
      left: 14px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #090d1a;
      border: 2.5px solid var(--ink-black);
      box-shadow: 2px 2px 0 var(--ink-black);
      padding: 2px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 900;
      transform: skewX(-8deg);
    }
    .vn-speaker > span {
      display: inline-block;
      transform: skewX(8deg);
    }

    .vn-text {
      margin: 0;
      font-size: 0.98rem;
      color: #f1f5f9;
    }
    .vn-text strong {
      color: #fde047;
    }

    .event-title {
      font-size: clamp(1.18rem, 3.6vw, 1.48rem);
      font-weight: 900;
      color: #fde047;
      margin: 0 0 6px;
      text-shadow: 2px 2px 0 var(--ink-black);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .san-warning-box {
      background: rgba(168, 85, 247, 0.2);
      border: 2.5px dashed #e879f9;
      color: #fae8ff;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 0.88rem;
      font-weight: 800;
      margin: 8px 0 14px;
    }

    /* ============================================================
       動漫風格按鈕 & 選項指令卡
       ============================================================ */
    .btn {
      width: 100%;
      border: 3px solid var(--ink-black);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
      box-shadow: 3px 4px 0 var(--ink-black);
      transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      font-family: inherit;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active:not(:disabled) {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink-black);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.45);
    }

    .btn-primary { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); color: #061325; }
    .btn-gold { background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); color: #090d1a; }
    .btn-green { background: linear-gradient(180deg, #34d399 0%, #059669 100%); color: #052e16; }
    .btn-red { background: linear-gradient(180deg, #fb7185 0%, #e11d48 100%); }
    .btn-purple { background: linear-gradient(180deg, #c084fc 0%, #7e22ce 100%); }
    .btn-slate { background: linear-gradient(180deg, #475569 0%, #334155 100%); }

    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: linear-gradient(135deg, #212e5e 0%, #172044 100%);
      border: 3px solid var(--ink-black);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 3px 4px 0 var(--ink-black);
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.15s, background 0.15s;
      font-family: inherit;
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .choice-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #2c3d7a 0%, #1d2957 100%);
      border-color: var(--anime-gold);
      transform: translateX(3px);
    }

    .choice-btn:active:not(:disabled) {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink-black);
    }

    .choice-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .choice-key {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      margin-top: 2px;
      background: var(--anime-cyan);
      color: #090d1a;
      border: 2px solid var(--ink-black);
      border-radius: 7px;
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 var(--ink-black);
    }

    .choice-body {

  <script>
    /* ==========================================================================
       1. Web Audio API 動漫風 8-bit 音效合成器
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;

      function ensureCtx() {
        if (muted) return null;
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) ctx = new AudioCtx();
          }
          if (ctx && ctx.state === 'suspended') ctx.resume();
          return ctx;
        } catch (e) {
          return null;
        }
      }

      function playTone(freq, duration, type = 'triangle', volume = 0.08, delay = 0, slideTo = null) {
        const audio = ensureCtx();
        if (!audio) return;
        try {
          const now = audio.currentTime + delay;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {}
      }

      return {
        isMuted: () => muted,
        toggleMute() {
          muted = !muted;
          if (!muted) this.click();
          return muted;
        },
        click() {
          playTone(660, 0.055, 'triangle', 0.07, 0, 920);
        },
        gachaTick() {
          playTone(420 + Math.random() * 340, 0.045, 'triangle', 0.07);
        },
        gachaReveal(isSSR) {
          if (isSSR) {
            [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) => {
              playTone(f, 0.16, 'triangle', 0.085, i * 0.07);
            });
          } else {
            playTone(440, 0.09, 'triangle', 0.08, 0);
            playTone(659.25, 0.16, 'triangle', 0.08, 0.08);
          }
        },
        coin() {
          playTone(987.77, 0.07, 'square', 0.06, 0);
          playTone(1318.51, 0.22, 'triangle', 0.09, 0.07);
        },
        damage() {
          playTone(210, 0.14, 'sawtooth', 0.09, 0, 95);
          playTone(140, 0.18, 'sawtooth', 0.08, 0.1, 65);
        },
        sanDrop() {
          playTone(420, 0.15, 'sine', 0.09, 0, 260);
          playTone(310, 0.22, 'sine', 0.08, 0.13, 175);
        },
        splash() {
          playTone(320 + Math.random() * 180, 0.06, 'triangle', 0.08, 0, 740);
        },
        victory() {
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          const times = [0, 0.1, 0.2, 0.32, 0.48];
          const durs = [0.09, 0.09, 0.11, 0.15, 0.38];
          notes.forEach((n, i) => playTone(n, durs[i], 'triangle', 0.085, times[i]));
        },
        gameover() {
          [392, 349.23, 329.63, 261.63].forEach((n, i) => {
            playTone(n, 0.24, 'sawtooth', 0.065, i * 0.19, n * 0.9);
          });
        }
      };
    })();

    /* ==========================================================================
       2. 動漫賽璐珞風格動態頭像與 SVG 場景插畫
       ========================================================================== */
    function getAnimeAvatarSvg(hp, san, originId) {
      const isLowHp = hp <= 35;
      const isLowSan = san <= 35;
      const bg = isLowHp ? '#7f1d1d' : isLowSan ? '#581c87' : '#0369a1';
      const tunic = originId === 'hakka' ? '#0ea5e9' : originId === 'zhangzhou' ? '#16a34a' : '#2563eb';
      const eyes = isLowSan
        ? `<circle cx="34" cy="40" r="4.5" fill="#fff" stroke="#090d1a" stroke-width="1.5"/>

    /* ==========================================================================
       4. 本地存檔管理
       ========================================================================== */
    const STORAGE_KEY = 'dutai_survival_endings_v1';

    const Storage = {
      getUnlocked() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      },
      unlock(endingId) {
        const list = this.getUnlocked();
        let isNew = false;
        if (!list.includes(endingId)) {
          list.push(endingId);
          isNew = true;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          } catch (e) {}
        }
        updateGalleryCounter();
        return isNew;
      },
      clear() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        updateGalleryCounter();
      }
    };

    function showToast(text, emoji = '💬') {
      const container = $('toast-container');
      const el = document.createElement('div');
      el.className = 'meme-toast';
      el.innerHTML = `<span style="font-size:1.3rem;">${emoji}</span><span>${text}</span>`;
      container.appendChild(el);
      while (container.children.length > 2) {
        container.removeChild(container.firstChild);
      }
      setTimeout(() => {
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function flashScreen(type) {
      const el = $('screen-flash');
      el.className = '';
      void el.offsetWidth;
      el.className = `flash-${type}`;
    }

    function shakeScreen(heavy = false) {
      const wrap = $('app-wrapper');
      wrap.classList.remove('shake-light', 'shake-heavy');
      void wrap.offsetWidth;
      wrap.classList.add(heavy ? 'shake-heavy' : 'shake-light');
    }

    function spawnFloatingText(text, color, targetBoxId = null, indexOffset = 0) {
      const layer = $('floating-layer');
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.color = color;

      let x = window.innerWidth * 0.5 + (indexOffset * 36 - 18);
      let y = window.innerHeight * 0.34 + (indexOffset * 26);

      if (targetBoxId) {
        const box = $(targetBoxId);
        if (box) {
          const rect = box.getBoundingClientRect();
          if (rect.width > 0) {
            x = rect.left + rect.width / 2;
            y = rect.bottom + 8 + indexOffset * 18;
          }
        }
      }

      el.style.left = `${Math.max(70, Math.min(window.innerWidth - 70, x))}px`;
      el.style.top = `${Math.max(60, Math.min(window.innerHeight - 90, y))}px`;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    function applyStatChanges(delta, options = {}) {
      if (!GameState) return { changes: [], diedEndingId: null, mazuSaved: false };
      const { deathCause = 'normal', silent = false } = options;
      const changes = [];
      let tookDamage = false;
      let gainedMoney = false;
      let lostSan = false;

      if (delta.hp) {
        GameState.stats.hp = Math.min(100, GameState.stats.hp + delta.hp);
        changes.push({ label: `${delta.hp > 0 ? '+' : ''}${delta.hp} HP`, color: delta.hp > 0 ? '#4ade80' : '#fb7185', box: 'box-hp', pos: delta.hp > 0 });
        if (delta.hp < 0) tookDamage = true;
      }
      if (delta.money) {
        GameState.stats.money = Math.max(0, GameState.stats.money + delta.money);
        changes.push({ label: `${delta.money > 0 ? '+' : ''}${delta.money} 銀兩`, color: delta.money > 0 ? '#fde047' : '#fb923c', box: 'box-money', pos: delta.money > 0 });
        if (delta.money > 0) gainedMoney = true;
      }
      if (delta.san) {
        GameState.stats.san = Math.max(0, Math.min(100, GameState.stats.san + delta.san));
        changes.push({ label: `${delta.san > 0 ? '+' : ''}${delta.san} SAN`, color: delta.san > 0 ? '#e879f9' : '#f472b6', box: 'box-san', pos: delta.san > 0 });
        if (delta.san < 0) lostSan = true;
      }
      if (delta.rep) {
        GameState.stats.rep = Math.max(0, Math.min(100, GameState.stats.rep + delta.rep));
        changes.push({ label: `${delta.rep > 0 ? '+' : ''}${delta.rep} 人脈`, color: delta.rep > 0 ? '#34d399' : '#fda4af', box: 'box-rep', pos: delta.rep > 0 });
      }

      let mazuSaved = false;
      if (GameState.stats.hp <= 0 && GameState.talent && GameState.talent.id === 'mazu_godson' && !GameState.flags.mazuShieldUsed) {
        GameState.flags.mazuShieldUsed = true;
        GameState.stats.hp = 20;
        mazuSaved = true;
        flashScreen('gold');
        SoundFX.gachaReveal(true);
        showToast('🏮 媽祖神威發動！SSR 金光護體鎖血復活（HP→20）！', '✨');
        changes.push({ label: '媽祖護體！HP→20', color: '#fde047', box: 'box-hp', pos: true });
      }

      if (!silent) {
        changes.forEach((c, idx) => {
          setTimeout(() => spawnFloatingText(c.label, c.color, c.box, idx), idx * 90);
        });

        if (tookDamage && !mazuSaved) {
          SoundFX.damage();
          flashScreen('red');
          shakeScreen(delta.hp <= -30);
        } else if (gainedMoney) {
          SoundFX.coin();
          flashScreen('gold');
        } else if (lostSan) {
          SoundFX.sanDrop();
          flashScreen('purple');
          shakeScreen(false);
        } else if (changes.some(c => c.pos)) {
          SoundFX.click();
          flashScreen('green');
        }
      }

      updateHUD();

      let diedEndingId = null;
      if (GameState.stats.hp <= 0) {
        GameState.stats.hp = 0;
        updateHUD();
        if (deathCause === 'sandbar') diedEndingId = 'hidden_sandbar';
        else if (deathCause === 'sea') diedEndingId = 'hidden_sea';
        else if (deathCause === 'jail') diedEndingId = 'hidden_jail';
        else diedEndingId = 'n_youyinggong';
      } else if (GameState.stats.san <= 0) {
        diedEndingId = 'hidden_san';
      }

      return { changes, diedEndingId, mazuSaved };
    }

    function finalizeGachaDraw() {
      if (!GameState) return;
      const base = createInitialState(GameState.mode).stats;
      GameState.stats = { ...base };

      const origin = ORIGINS[Math.floor(Math.random() * ORIGINS.length)];
      const pool = [
        TALENTS[0],
        TALENTS[1], TALENTS[1],
        TALENTS[2], TALENTS[2],
        TALENTS[3], TALENTS[3],
        TALENTS[4], TALENTS[4],
        TALENTS[5]
      ];
      const talent = pool[Math.floor(Math.random() * pool.length)];

      GameState.origin = origin;
      GameState.talent = talent;

      const combineMods = {
        hp: (origin.mods?.hp || 0) + (talent.mods?.hp || 0),
        money: (origin.mods?.money || 0) + (talent.mods?.money || 0),
        san: (origin.mods?.san || 0) + (talent.mods?.san || 0),
        rep: (origin.mods?.rep || 0) + (talent.mods?.rep || 0)
      };

      GameState.stats.hp = Math.min(100, GameState.stats.hp + combineMods.hp);

    /**
     * 第一章 1-2：動漫 QTE「超必殺・5秒狂點舀水」
     */
    function renderStage1B_MiniGame() {
      cleanupTransientState();
      updateHUD('第一章：黑水溝 QTE (2/3)');
      const hasIronStomach = GameState.talent && GameState.talent.id === 'iron_stomach';
      const targetClicks = hasIronStomach ? 12 : 15;
      const totalDuration = 5.0;

      $('game-root').innerHTML = `
        <div class="game-panel">
          <h2 class="event-title">🌊 緊急 QTE：黑水溝超級暴風雨！</h2>
          <div class="vn-box">
            <div class="vn-speaker"><span>⚡ 突發戰鬥</span></div>
            <p class="vn-text">
              船隻駛入澎湖水道「<strong>黑水溝</strong>」，十級狂浪瘋狂灌進船艙！<br>
              🔥 <strong>限時連打挑戰</strong>：在 <strong>5 秒內</strong>狂點「🪣 狂舀海水」（或狂按<strong>空白鍵</strong>）至少 <strong>${targetClicks} 下</strong>${hasIronStomach ? '（鐵胃外掛已降低目標！）' : ''}，守住這艘船！
            </p>

            <div class="boat-stage" id="mg-boat">⛵</div>

              <div>
                <div class="mg-bar-label">
                  <span>⏱️ 剩餘時間</span>
                  <span id="mg-time-text">5.0 秒</span>
                </div>
                <div class="mg-track"><div class="mg-fill-time" id="mg-time-bar"></div></div>
              </div>
              <div>
                <div class="mg-bar-label">
                  <span>🪣 舀水連擊進度</span>
                  <span id="mg-count-text">0 / ${targetClicks} HIT</span>
                </div>
                <div class="mg-track"><div class="mg-fill-water" id="mg-water-bar"></div></div>
              </div>
            </div>

            <button id="btn-mg-start" class="btn btn-gold" type="button" style="max-width:310px; margin:0 auto;">
              🔥 發動 5 秒舀水連打！
            </button>
            <button id="btn-mg-bail" class="bail-btn" type="button" style="display:none;">
              🪣 瘋狂舀水！(連點 / 空白鍵)
            </button>
          </div>
        </div>
      `;

      let started = false;
      let finished = false;
      let clicks = 0;
      let startTime = 0;

      const startBtn = $('btn-mg-start');
      const bailBtn = $('btn-mg-bail');

      function registerBail() {
        if (!started || finished || !GameState) return;
        const countEl = $('mg-count-text');
        const waterBar = $('mg-water-bar');
        const comboEl = $('mg-combo');
        if (!countEl || !waterBar) return;

        clicks++;
        SoundFX.splash();
        bailBtn.classList.add('pressed');
        setTimeout(() => bailBtn.classList.remove('pressed'), 55);

        const pct = Math.min(100, (clicks / targetClicks) * 100);
        countEl.textContent = `${clicks} / ${targetClicks} HIT`;
        waterBar.style.width = `${pct}%`;
        if (comboEl) comboEl.textContent = `🔥 ${clicks} COMBO!`;

        if (clicks % 4 === 0) {
          spawnFloatingText(`💦 ${clicks} HIT!`, '#7dd3fc', null, 0);
        }

        if (clicks >= targetClicks) {
          finishMiniGame(true);
        }
      }

      function finishMiniGame(success) {
        if (finished || !GameState) return;
        finished = true;
        cleanupTransientState();

        if (success) {
          // 修正：成功通關不再無故扣 HP，避免邊界條件誤判死亡
          const res = applyStatChanges({ san: 10, rep: 5 });
          renderOutcomeCard({
            artHtml: SceneArt.seaStorm('超必殺連打成功・突破黑水溝！'),
            title: '🏆 神手速！船艙海水瞬間清光！',
            speaker: '⛵ 全船乘客',
            narrative: `你在 5 秒內狂打 ${clicks} 下，水花飛濺宛如動漫奧義發動！全船乘客看傻了眼，烏雲隨即散開，遠方已經看見臺灣的翡翠山脈了！`,
            changes: res.changes,
            toastMsg: '手速突破天際！黑水溝直接被你刷爆！',
            toastEmoji: '⚡',
            nextLabel: '準備靠岸登陸臺灣 ▶',
            onNext: renderStage1C_Landing,
            diedEndingId: res.diedEndingId
          });
        } else {
          const baseDmg = GameState.mode === 'elementary' ? -30 : -45;
          const finalDmg = hasIronStomach ? baseDmg + 12 : baseDmg;
          const res = applyStatChanges({ hp: finalDmg, san: -15 }, { deathCause: 'sea' });
          renderOutcomeCard({
            artHtml: SceneArt.seaStorm('船艙進水大危機！'),
            title: '🌊 糟糕！舀水來不及，巨浪打翻甲板！',
            speaker: '⛵ 船長大喊',
            narrative: `你只打了 ${clicks} 下（還差 ${targetClicks - clicks} 下）！巨浪把你沖得七葷八素，喝了好幾口鹹死人的黑水溝海水，差點就領便當去見海龍王！`,
            changes: res.changes,
            toastMsg: '黑水溝不相信眼淚，只相信你的手速！',
            toastEmoji: '🌊',
            nextLabel: '狼狽漂向臺灣海岸 ▶',
            onNext: renderStage1C_Landing,
            diedEndingId: res.diedEndingId
          });
        }
      }

      activeKeyHandler = (e) => {
        if (e.code === 'Space' && started && !finished) {
          e.preventDefault();
          registerBail();
        }
      };

      startBtn.addEventListener('click', () => {
        SoundFX.click();
        started = true;
        startBtn.style.display = 'none';
        bailBtn.style.display = 'flex';
        $('mg-status').textContent = '🌊 狂風暴雨來襲！快連打舀水！';
        $('mg-combo').textContent = '🔥 FIGHT!';
        startTime = performance.now();
        window.addEventListener('keydown', activeKeyHandler);
        shakeScreen(false);

        activeMiniGameTimer = setInterval(() => {
          if (!GameState) {
            cleanupTransientState();
            return;
          }
          const elapsed = (performance.now() - startTime) / 1000;
          const remain = Math.max(0, totalDuration - elapsed);
          const timeText = $('mg-time-text');
          const timeBar = $('mg-time-bar');
          if (timeText) timeText.textContent = `${remain.toFixed(1)} 秒`;
          if (timeBar) timeBar.style.width = `${(remain / totalDuration) * 100}%`;

          if (remain <= 0) {
            finishMiniGame(clicks >= targetClicks);
          }
        }, 50);
      });

      bailBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        registerBail();
      });
    }

          narrative: '戰火期間糧價飆漲，但你早就買滿一缸白米躲在家裡，等官兵平定亂事才淡定開門！',
          changes: res.changes,
          toastMsg: '吃瓜群眾總是能安穩活到結局！',
          toastEmoji: '🍿',
          nextLabel: '迎接人生最終章 ▶',
          onNext: renderStage3C_FinalTurn,
          diedEndingId: res.diedEndingId
        });
      });
    }

    function renderStage3C_FinalTurn() {
      cleanupTransientState();
      updateHUD('最終幕：落地生根 (3/3)');
      GameState.learnedTags.add('ancestor_shift');
      const isJunior = GameState.mode === 'junior';

      $('game-root').innerHTML = `
        <div class="game-panel">
          ${SceneArt.temple('最終幕 3-3：歲月流轉・落地生根')}
          <h2 class="event-title">🏛️ 數十年過去，你的人生迎來終章選擇！</h2>
          <div class="vn-box">
            <div class="vn-speaker"><span>🌅 歲月見證</span></div>
            <p class="vn-text">
              ${isJunior
                ? '隨著清廷放寬渡臺禁令，移民社會從動盪走向穩定。你的事業與生活全在臺灣，這時鄉親問你：要繼續合資祭祀原鄉的<strong>「唐山祖」</strong>，還是在臺灣建宗祠、成為後代祭拜的<strong>「開臺祖」</strong>？'
                : '熬過了黑水溝狂浪、開墾農田與時代風雨，看著眼前翠綠的稻田與熱情的臺灣鄉親，你決定怎麼譜寫人生最後一頁？'}
            </p>
          </div>
          <div class="choices-list">
            <button class="choice-btn" id="c-final-ancestor" type="button" ${GameState.stats.money < 25 ? 'disabled' : ''}>
              <span class="choice-key" style="background:#fde047;">A</span>
              <div class="choice-body">
                <div class="choice-title">
                  <span>🏛️ 在臺灣建宗祠、娶妻生子，立志成為「開臺祖」！</span>
                  <span class="cost-badge good">銀兩 -25・人脈 +20・理智 +20</span>
                </div>
                <div class="choice-hint">從唐山過客蛻變為臺灣主人（本土化轉型）！${GameState.stats.money < 25 ? '（銀兩不足）' : ''}</div>
              </div>
            </button>

            <button class="choice-btn" id="c-final-biz" type="button">
              <span class="choice-key">B</span>
              <div class="choice-body">
                <div class="choice-title">
                  <span>💰 全部精力投入商行與田產，衝刺全臺首富！</span>
                  <span class="cost-badge">銀兩 +35・體力 -10</span>
                </div>
                <div class="choice-hint">「別跟我談感性，我只在乎倉庫裡滿出來的銀兩！」</div>
              </div>
            </button>

            <button class="choice-btn" id="c-final-chill" type="button">
              <span class="choice-key" style="background:#34d399;">C</span>
              <div class="choice-body">
                <div class="choice-title">
                  <span>🍵 退隱鄉間喝茶種菜，享受安穩慢活人生</span>
                  <span class="cost-badge good">體力 +20・理智 +15</span>
                </div>
                <div class="choice-hint">平平安安走到終點，就是最強的生存贏家！</div>
              </div>
            </button>
          </div>
        </div>
      `;

      $('c-final-ancestor').addEventListener('click', () => {
        const res = applyStatChanges({ money: -25, rep: 20, san: 20 });
        if (res.diedEndingId) return renderStage4Ending(res.diedEndingId);
        renderStage4Ending(evaluateSurvivalEnding(true));
      });

      $('c-final-biz').addEventListener('click', () => {
        const res = applyStatChanges({ money: 35, hp: -10 });
        if (res.diedEndingId) return renderStage4Ending(res.diedEndingId);
        renderStage4Ending(evaluateSurvivalEnding(false));
      });

      $('c-final-chill').addEventListener('click', () => {
        const res = applyStatChanges({ hp: 20, san: 15 });
        if (res.diedEndingId) return renderStage4Ending(res.diedEndingId);
        renderStage4Ending(evaluateSurvivalEnding(false));
      });
    }

    /* ==========================================================================
       11. 最終章：結局判定與歷史真相解密
       ========================================================================== */
    function evaluateSurvivalEnding(choseAncestor) {
      const { hp, money, rep } = GameState.stats;
      // 修正：若玩家刻意選擇建宗祠成為開臺祖且達標，優先授予 SSR 一代開臺祖！
      if (choseAncestor && rep >= 55 && money >= 50) return 'ssr_ancestor';
      if (GameState.flags.investedCanal && money >= 115) return 'ssr_canal';
      if (rep >= 65 && money >= 85 && hp >= 35) return 'ssr_ancestor';
      if (GameState.flags.becameYimin && rep >= 60) return 'sr_yimin';
      if (money >= 95) return 'sr_tycoon';
      if (money < 35 || rep < 30 || (GameState.talent && GameState.talent.id === 'luohanjiao_body' && rep < 45)) return 'r_luohanjiao';
      return 'r_farmer';
    }

    function pickThreeHistoricalFacts() {
      const tags = Array.from(GameState.learnedTags);
      const fallbackOrder = ['black_ditch', 'ban_three', 'canal_water', 'tuniugou', 'xiedou', 'rebellion', 'ancestor_shift', 'beliefs'];
      for (const t of fallbackOrder) {
        if (tags.length >= 3) break;
        if (!tags.includes(t)) tags.push(t);
      }
      return tags.slice(-3).map(k => HISTORY_FACTS[k]).filter(Boolean);
    }

    function renderStage4Ending(endingId) {
      cleanupTransientState();
      GameState.stage = 4;
      updateHUD('結局：人生結算完成');
      const ending = ENDINGS[endingId] || ENDINGS.r_farmer;
      const isDeath = ending.rarity === 'CURSED' || endingId === 'n_youyinggong';
      const isNewUnlock = Storage.unlock(ending.id);

      if (isDeath) {
        SoundFX.gameover();
        flashScreen('red');
      } else {
        SoundFX.victory();
        flashScreen('gold');
      }

      showToast(ending.toast, ending.emoji);

      const facts = pickThreeHistoricalFacts();
      const unlockedCount = Storage.getUnlocked().length;
      const totalEndings = Object.keys(ENDINGS).length;

      $('game-root').innerHTML = `
        <div class="game-panel" style="text-align:center;">
          <div style="font-size:0.9rem; font-weight:900; color:#7dd3fc; margin-bottom:10px;">
            ${isDeath ? '💀 BAD END・歷史留下一聲嘆息' : '🎉 STAGE CLEAR！清代臺灣求生破關！'}
            ${isNewUnlock ? '<span style="background:#fde047; color:#090d1a; padding:2px 9px; border-radius:999px; margin-left:6px; border:1.5px solid #090d1a;">NEW 圖鑑解鎖!</span>' : ''}
          </div>

          <div class="gacha-card rarity-${ending.rarity}" style="max-width:450px; margin:0 auto 16px;">
            <div class="gacha-inner" style="padding:22px 18px;">
              <span class="rarity-badge">[${ending.rarity}] ${ending.tag}</span>
              <div class="card-emoji" style="font-size:3.8rem;">${ending.emoji}</div>
              <div class="card-name" style="font-size:1.55rem; margin-bottom:4px;">${ending.title}</div>
              <div class="card-desc" style="font-size:0.95rem; color:#f1f5f9;">${ending.desc}</div>
              <div class="card-effect" style="margin-top:12px; color:#7dd3fc;">
                最終戰績：❤️ ${GameState.stats.hp} ｜ 💰 ${GameState.stats.money}兩 ｜ 🧠 ${GameState.stats.san} ｜ 🤝 ${GameState.stats.rep}
              </div>
            </div>
          </div>

          <div class="history-egg">
            <h4>📚 下回預告・歷史真相解密（你剛剛經歷的 108 課綱重點！）</h4>
            <ul>
              ${facts.map(f => `<li>${f}</li>`).join('')}
            </ul>
          </div>

          <div class="btn-row">
            <button id="btn-replay" class="btn btn-gold" type="button">🔄 同路線再渡一次黑水溝</button>
            <button id="btn-end-gallery" class="btn btn-purple" type="button">📖 查看圖鑑 (${unlockedCount}/${totalEndings})</button>
          </div>
          <button id="btn-back-home" class="btn btn-slate" type="button" style="margin-top:10px;">
            🏠 回主畫面切換故事難度
          </button>
        </div>
      `;

      $('btn-replay').addEventListener('click', () => {
        SoundFX.click();
        startNewGame(GameState.mode);
      });
      $('btn-end-gallery').addEventListener('click', () => {
        SoundFX.click();
        openGalleryModal();
      });
      $('btn-back-home').addEventListener('click', () => {
        SoundFX.click();
        renderHome();
      });
    }

    /* ==========================================================================
       12. 圖鑑系統與無障礙 Modal 控制
       ========================================================================== */
    function updateGalleryCounter() {
      const unlocked = Storage.getUnlocked();
      const total = Object.keys(ENDINGS).length;
      $('gallery-count-top').textContent = `${unlocked.length}/${total}`;
      $('gallery-progress-text').textContent = `${unlocked.length} / ${total} (${Math.round((unlocked.length / total) * 100)}%)`;
      $('gallery-bar-fill').style.width = `${(unlocked.length / total) * 100}%`;
    }

    function openGalleryModal() {
      const unlocked = Storage.getUnlocked();
      updateGalleryCounter();
      $('gallery-grid').innerHTML = Object.values(ENDINGS).map(end => {
        const has = unlocked.includes(end.id);
        return `
          <div class="gallery-item ${has ? 'unlocked' : 'locked'}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:1.75rem;">${has ? end.emoji : '❓'}</span>
              <span class="mini-tag ${end.rarity.toLowerCase()}">[${end.rarity}] ${end.tag}</span>
            </div>
            <div style="font-weight:900; font-size:0.98rem; color:${has ? '#fde047' : '#94a3b8'};">
              ${has ? end.title : '尚未解鎖結局'}
            </div>
            <div style="font-size:0.8rem; color:#cbd5e1;">
              ${has ? end.desc : '繼續挑戰不同選擇與死法，收集 100% 渡臺圖鑑！'}
            </div>
          </div>
        `;
      }).join('');
      $('gallery-modal').classList.add('open');
    }

    function closeGalleryModal() {
      $('gallery-modal').classList.remove('open');
    }

    function initApp() {
      updateGalleryCounter();

      $('btn-mute').addEventListener('click', () => {
        const muted = SoundFX.toggleMute();
        $('btn-mute').textContent = muted ? '🔇 靜音中' : '🔊 音效開';
      });

      $('btn-gallery-top').addEventListener('click', () => {
        SoundFX.click();
        openGalleryModal();
      });

      $('btn-close-gallery').addEventListener('click', () => {
        SoundFX.click();
        closeGalleryModal();
      });

      $('gallery-modal').addEventListener('click', (e) => {
        if (e.target === $('gallery-modal')) closeGalleryModal();
      });

      $('btn-reset-gallery').addEventListener('click', () => {
        SoundFX.click();
        $('confirm-modal').classList.add('open');
      });

      $('btn-confirm-cancel').addEventListener('click', () => {
        SoundFX.click();
        $('confirm-modal').classList.remove('open');
      });

      $('btn-confirm-ok').addEventListener('click', () => {
        SoundFX.damage();
        Storage.clear();
        $('confirm-modal').classList.remove('open');
        openGalleryModal();
        showToast('圖鑑紀錄已清空，重新展開收集之旅！', '🗑️');
        if (!GameState) renderHome();
      });

      $('btn-home').addEventListener('click', () => {
        SoundFX.click();
        renderHome();
      });

      // 支援 Esc 鍵關閉 Modal
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if ($('confirm-modal').classList.contains('open')) {
          $('confirm-modal').classList.remove('open');
        } else if ($('gallery-modal').classList.contains('open')) {
          closeGalleryModal();
        }
      });

      renderHome();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
