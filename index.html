<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>渡臺求生記：黑水溝不相信眼淚</title>
  <style>
    /* ============================================================
       基礎變數與復古像素 + 現代手遊質感設計系統
       ============================================================ */
    :root {
      --bg-deep: #0b1120;
      --bg-sea: #13203a;
      --panel-bg: #1e293b;
      --panel-light: #273549;
      --border-pixel: #090d16;
      --border-highlight: #475569;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-dim: #94a3b8;

      /* 數值顏色 */
      --hp-color: #ef4444;
      --money-color: #f59e0b;
      --san-color: #a855f7;
      --rep-color: #10b981;

      /* 稀有度顏色 */
      --ssr-grad: linear-gradient(135deg, #fde047 0%, #f59e0b 45%, #fef08a 70%, #d97706 100%);
      --sr-grad: linear-gradient(135deg, #c084fc 0%, #7e22ce 100%);
      --r-grad: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
      --n-grad: linear-gradient(135deg, #94a3b8 0%, #475569 100%);
      --cursed-grad: linear-gradient(135deg, #f43f5e 0%, #881337 100%);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --pixel-shadow: 0 4px 0 #090d16, 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b2e4d 0%, var(--bg-deep) 75%);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      line-height: 1.55;
    }

    /* 背景復古格線紋理 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* 畫面震動與色彩閃爍特效層 */
    #screen-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
    }

    .flash-red { animation: flashAnim 0.42s ease-out; background: rgba(239, 68, 68, 0.45); }
    .flash-gold { animation: flashAnim 0.45s ease-out; background: rgba(250, 204, 21, 0.35); }
    .flash-purple { animation: flashAnim 0.45s ease-out; background: rgba(168, 85, 247, 0.4); }
    .flash-green { animation: flashAnim 0.4s ease-out; background: rgba(16, 185, 129, 0.32); }

    @keyframes flashAnim {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    .shake-light { animation: shakeAnim 0.35s cubic-bezier(.36,.07,.19,.97) both; }
    .shake-heavy { animation: shakeHeavyAnim 0.5s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 2px, 0); }
      40%, 60% { transform: translate3d(5px, -2px, 0); }
    }

    @keyframes shakeHeavyAnim {
      10%, 90% { transform: translate3d(-7px, 2px, 0); }
      20%, 80% { transform: translate3d(8px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-10px, 4px, 0); }
      40%, 60% { transform: translate3d(10px, -4px, 0); }
    }

    /* 主容器 */
    #app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 12px 14px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       頂部工具列與固定 4 大數值 HUD
       ============================================================ */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: #fde68a;
      text-shadow: 2px 2px 0 #090d16;
    }

    .mode-pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      border: 2px solid var(--border-pixel);
    }
    .mode-pill.elem { background: #15803d; color: #dcfce7; }
    .mode-pill.junior { background: #b91c1c; color: #fee2e2; }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: var(--panel-bg);
      color: var(--text-main);
      border: 2px solid var(--border-pixel);
      box-shadow: 0 3px 0 var(--border-pixel);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
    }
    .icon-btn:hover { background: var(--panel-light); }
    .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-pixel);
    }

    /* HUD 固定區域 */
    #hud-container {
      position: sticky;
      top: 8px;
      z-index: 40;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      border: 3px solid var(--border-pixel);
      outline: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: var(--pixel-shadow);
      display: none;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .hud-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }

    .stat-box {
      position: relative;
      background: #162033;
      border: 2px solid #090d16;
      border-radius: 8px;
      padding: 6px 8px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label { color: var(--text-muted); }
    .stat-val {
      font-family: "Courier New", monospace;
      font-weight: 900;
      font-size: 0.95rem;
    }

    .bar-track {
      height: 8px;
      background: #090d16;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .bar-fill {
      height: 100%;
      width: 50%;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s;
      border-radius: 3px;
    }
    .bar-hp { background: linear-gradient(90deg, #dc2626, #f87171); }
    .bar-money { background: linear-gradient(90deg, #d97706, #fbbf24); }
    .bar-san { background: linear-gradient(90deg, #7e22ce, #c084fc); }
    .bar-rep { background: linear-gradient(90deg, #059669, #34d399); }

    .stat-danger {
      animation: pulseDanger 0.9s infinite alternate;
      border-color: #ef4444 !important;
    }
    @keyframes pulseDanger {
      from { box-shadow: 0 0 0 rgba(239, 68, 68, 0.2); }
      to { box-shadow: 0 0 12px rgba(239, 68, 68, 0.75); }
    }

    /* 玩家身分標籤列（在 HUD 下方） */
    .hud-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .mini-tag {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mini-tag.ssr { border-color: #facc15; color: #fde047; }
    .mini-tag.sr { border-color: #c084fc; color: #e9d5ff; }
    .mini-tag.r { border-color: #60a5fa; color: #bfdbfe; }
    .mini-tag.n { border-color: #94a3b8; color: #e2e8f0; }
    .mini-tag.cursed { border-color: #f43f5e; color: #fda4af; }

    /* 進度條 */
    .stage-badge {
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    /* ============================================================
       螢幕飄字特效 & 迷因 Toast 吐槽彈窗
       ============================================================ */
    #floating-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 120;
      overflow: hidden;
    }

    .float-text {
      position: absolute;
      font-family: "Courier New", "Microsoft JhengHei", monospace;
      font-weight: 900;
      font-size: 1.25rem;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      animation: floatUpFade 1.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      white-space: nowrap;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
      20% { opacity: 1; transform: translate(-50%, -12px) scale(1.18); }
      100% { opacity: 0; transform: translate(-50%, -82px) scale(0.95); }
    }

    #toast-container {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 130;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(92vw, 440px);
      pointer-events: none;
    }

    .meme-toast {
      background: rgba(15, 23, 42, 0.96);
      border: 3px solid #f59e0b;
      box-shadow: 0 6px 0 #090d16, 0 10px 24px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fef3c7;
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .meme-toast.fade-out {
      animation: toastOut 0.3s ease-in forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-10px) scale(0.92); }
    }

    /* ============================================================
       主遊戲卡片面板
       ============================================================ */
    .game-panel {
      background: var(--panel-bg);
      border: 3px solid var(--border-pixel);
      outline: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: var(--radius-lg);
      box-shadow: var(--pixel-shadow);
      padding: 20px;
      animation: panelPop 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes panelPop {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 520px) {
      .game-panel { padding: 15px 13px; }
    }

    /* 場景插畫區 */
    .scene-box {
      width: 100%;
      height: 170px;
      border-radius: var(--radius-md);
      border: 3px solid var(--border-pixel);
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scene-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(9, 13, 22, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.18);
      color: #fde68a;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    /* 標題與文字 */
    .hero-title {
      text-align: center;
      font-size: clamp(1.55rem, 5vw, 2.25rem);
      font-weight: 900;
      margin: 6px 0 4px;
      color: #fef08a;
      text-shadow: 3px 3px 0 #090d16, 0 0 18px rgba(250, 204, 21, 0.35);
      letter-spacing: 1px;
    }

    .hero-subtitle {
      text-align: center;
      color: #93c5fd;
      font-size: 0.98rem;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .event-title {
      font-size: clamp(1.18rem, 3.6vw, 1.45rem);
      font-weight: 900;
      color: #fde68a;
      margin: 0 0 10px;
      text-shadow: 2px 2px 0 #090d16;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .event-story {
      font-size: 0.98rem;
      color: #e2e8f0;
      margin: 0 0 16px;
      background: rgba(15, 23, 42, 0.55);
      border-left: 4px solid #38bdf8;
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
    }

    .event-story strong {
      color: #fde047;
    }

    .san-warning-box {
      background: rgba(168, 85, 247, 0.18);
      border: 2px dashed #c084fc;
      color: #f3e8ff;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* ============================================================
       按鈕系統（復古立體按壓感）
       ============================================================ */
    .btn {
      width: 100%;
      border: 3px solid var(--border-pixel);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 4px 0 var(--border-pixel);
      transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      font-family: inherit;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-pixel);
    }
    .btn:disabled {
      opacity: 0.52;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    .btn-primary { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); }
    .btn-gold { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); color: #fffbeb; }
    .btn-green { background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); }
    .btn-red { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); }
    .btn-purple { background: linear-gradient(180deg, #a855f7 0%, #6b21a8 100%); }
    .btn-slate { background: linear-gradient(180deg, #475569 0%, #334155 100%); }

    /* 選項按鈕卡片 */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: linear-gradient(180deg, #29384f 0%, #1f2b3e 100%);
      border: 3px solid var(--border-pixel);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border-pixel);
      transition: transform 0.08s, box-shadow 0.08s, border-color 0.15s, background 0.15s;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .choice-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #334663 0%, #25344b 100%);
      border-color: #f59e0b;
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-pixel);
    }

    .choice-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .choice-title {
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .choice-hint {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .cost-badge {
      font-size: 0.74rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #475569;
      color: #fde68a;
      font-weight: 700;
      white-space: nowrap;
    }
    .cost-badge.risk { border-color: #ef4444; color: #fca5a5; }
    .cost-badge.good { border-color: #10b981; color: #6ee7b7; }

    /* ============================================================
       首頁模式選擇卡片
       ============================================================ */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 16px 0;
    }

    @media (max-width: 600px) {
      .mode-grid { grid-template-columns: 1fr; }
    }

    .mode-card {
      background: #162033;
      border: 3px solid var(--border-pixel);
      border-radius: var(--radius-md);
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--border-pixel);
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      color: var(--text-main);
      font-family: inherit;
    }

    .mode-card:hover {
      transform: translateY(-2px);
      background: #1e2d47;
    }
    .mode-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--border-pixel);
    }

    .mode-card.elem-card { border-top: 6px solid #22c55e; }
    .mode-card.junior-card { border-top: 6px solid #ef4444; }

    .mode-card h3 {
      margin: 0;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-card p {
      margin: 0;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .mode-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .kw-chip {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-weight: 700;
    }

    /* ============================================================
       手遊抽卡質感卡片（階段 0 與 結局卡）
       ============================================================ */
    .gacha-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 16px 0;
    }

    @media (max-width: 580px) {
      .gacha-grid { grid-template-columns: 1fr; }
    }

    .gacha-card {
      position: relative;
      border-radius: var(--radius-md);
      padding: 3px;
      box-shadow: 0 6px 0 var(--border-pixel), 0 12px 24px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: cardReveal 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes cardReveal {
      0% { opacity: 0; transform: scale(0.82) rotateY(45deg); }
      100% { opacity: 1; transform: scale(1) rotateY(0); }
    }

    .gacha-card.rarity-SSR { background: var(--ssr-grad); }
    .gacha-card.rarity-SR { background: var(--sr-grad); }
    .gacha-card.rarity-R { background: var(--r-grad); }
    .gacha-card.rarity-N { background: var(--n-grad); }
    .gacha-card.rarity-CURSED { background: var(--cursed-grad); }

    /* SSR 流光掃描特效 */
    .gacha-card.rarity-SSR::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 45%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: rotate(25deg);
      animation: shimmerSweep 2.6s infinite;
      pointer-events: none;
    }

    @keyframes shimmerSweep {
      0% { left: -60%; }
      55%, 100% { left: 135%; }
    }

    .gacha-inner {
      background: #131c2e;
      border-radius: 9px;
      padding: 15px 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .rarity-badge {
      font-family: "Courier New", monospace;
      font-size: 0.78rem;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 999px;
      color: #090d16;
      letter-spacing: 0.6px;
    }
    .rarity-SSR .rarity-badge { background: #fde047; }
    .rarity-SR .rarity-badge { background: #d8b4fe; }
    .rarity-R .rarity-badge { background: #93c5fd; }
    .rarity-N .rarity-badge { background: #cbd5e1; }
    .rarity-CURSED .rarity-badge { background: #fda4af; }

    .card-emoji {

</head>

  <script>
    /* ==========================================================================
       1. Web Audio API 8-bit 復古音效合成器（免外部音檔）
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;

      function ensureCtx() {
        if (muted) return null;
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) ctx = new AudioCtx();
          }
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
          return ctx;
        } catch (e) {
          return null;
        }
      }

      function playTone(freq, duration, type = 'square', volume = 0.08, delay = 0, slideTo = null) {
        const audio = ensureCtx();
        if (!audio) return;
        try {
          const now = audio.currentTime + delay;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
          }
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {
          // 忽略瀏覽器音訊限制錯誤
        }
      }

      return {
        isMuted: () => muted,
        toggleMute() {
          muted = !muted;
          if (!muted) this.click();
          return muted;
        },
        click() {
          playTone(580, 0.06, 'square', 0.06, 0, 760);
        },
        gachaTick() {
          playTone(340 + Math.random() * 280, 0.05, 'triangle', 0.07);
        },
        gachaReveal(isSSR) {
          if (isSSR) {
            [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
              playTone(f, 0.16, 'square', 0.08, i * 0.075);
            });
          } else {
            playTone(440, 0.1, 'triangle', 0.08, 0);
            playTone(659.25, 0.16, 'triangle', 0.08, 0.09);
          }
        },
        coin() {
          playTone(987.77, 0.08, 'square', 0.07, 0);
          playTone(1318.51, 0.22, 'square', 0.07, 0.08);
        },
        damage() {
          playTone(220, 0.14, 'sawtooth', 0.1, 0, 95);
          playTone(150, 0.18, 'sawtooth', 0.09, 0.1, 65);
        },
        sanDrop() {
          playTone(390, 0.15, 'sine', 0.09, 0, 260);
          playTone(310, 0.22, 'sine', 0.08, 0.14, 180);
        },
        splash() {
          playTone(280 + Math.random() * 140, 0.06, 'triangle', 0.08, 0, 620);
        },
        victory() {
          const notes = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.5];
          const times = [0, 0.11, 0.22, 0.34, 0.48, 0.65];
          const durs = [0.09, 0.09, 0.1, 0.12, 0.15, 0.4];
          notes.forEach((n, i) => playTone(n, durs[i], 'square', 0.08, times[i]));
        },
        gameover() {
          const notes = [392, 349.23, 329.63, 261.63];
          notes.forEach((n, i) => playTone(n, 0.24, 'sawtooth', 0.07, i * 0.2, n * 0.92));
        }
      };
    })();

      },
      frontier(tag = '土牛溝番界・山林邊境') {

    const STORAGE_KEY = 'dutai_survival_endings_v1';

    const Storage = {
      getUnlocked() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      },
      unlock(endingId) {
        const list = this.getUnlocked();
        let isNew = false;
        if (!list.includes(endingId)) {
          list.push(endingId);
          isNew = true;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          } catch (e) {
            // 忽略隱私模式寫入限制
          }
        }
        updateGalleryCounter();
        return isNew;
      },
      clear() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        updateGalleryCounter();
      }
    };

      const container = $('toast-container');
      const el = document.createElement('div');
      el.className = 'meme-toast';
      el.innerHTML = `<span style="font-size:1.3rem;">${emoji}</span><span>${text}</span>`;
      container.appendChild(el);

      // 最多同時顯示 2 則，避免擋畫面
      while (container.children.length > 2) {
        container.removeChild(container.firstChild);
      }

      setTimeout(() => {
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 320);
      }, 2800);
    }

      const el = $('screen-flash');
      el.className = '';
      void el.offsetWidth; // 強制 reflow 讓動畫重播
      el.className = `flash-${type}`;
    }

    function shakeScreen(heavy = false) {
      const wrap = $('app-wrapper');
      wrap.classList.remove('shake-light', 'shake-heavy');
      void wrap.offsetWidth;
      wrap.classList.add(heavy ? 'shake-heavy' : 'shake-light');
    }

    function spawnFloatingText(text, color, targetBoxId = null, indexOffset = 0) {
      const layer = $('floating-layer');
      const el = document.createElement('div');
      el.className = 'float-text';
      el.textContent = text;
      el.style.color = color;

      let x = window.innerWidth * 0.5 + (indexOffset * 36 - 18);
      let y = window.innerHeight * 0.34 + (indexOffset * 26);

      if (targetBoxId) {
        const box = $(targetBoxId);
        if (box) {
          const rect = box.getBoundingClientRect();
          if (rect.width > 0) {
            x = rect.left + rect.width / 2;
            y = rect.bottom + 8 + indexOffset * 18;
          }
        }
      }

      el.style.left = `${Math.max(70, Math.min(window.innerWidth - 70, x))}px`;
      el.style.top = `${Math.max(60, Math.min(window.innerHeight - 90, y))}px`;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

      $('bar-rep').style.width = `${Math.max(0, Math.min(100, rep))}%`;

    /**
     * 核心數值增減函式：即時更新 HUD、飄字、音效、震動、閃光與死亡檢查
     */
    function applyStatChanges(delta, options = {}) {
      const { deathCause = 'normal', silent = false } = options;
      const changes = [];
      let tookDamage = false;
      let gainedMoney = false;
      let lostSan = false;

      if (delta.hp) {
        GameState.stats.hp = Math.min(100, GameState.stats.hp + delta.hp);
        changes.push({ label: `${delta.hp > 0 ? '+' : ''}${delta.hp} HP`, color: delta.hp > 0 ? '#4ade80' : '#f87171', box: 'box-hp', pos: delta.hp > 0 });
        if (delta.hp < 0) tookDamage = true;
      }
      if (delta.money) {
        GameState.stats.money = Math.max(0, GameState.stats.money + delta.money);
        changes.push({ label: `${delta.money > 0 ? '+' : ''}${delta.money} 銀兩`, color: delta.money > 0 ? '#fde047' : '#fb923c', box: 'box-money', pos: delta.money > 0 });
        if (delta.money > 0) gainedMoney = true;
      }
      if (delta.san) {
        GameState.stats.san = Math.max(0, Math.min(100, GameState.stats.san + delta.san));
        changes.push({ label: `${delta.san > 0 ? '+' : ''}${delta.san} SAN`, color: delta.san > 0 ? '#d8b4fe' : '#f472b6', box: 'box-san', pos: delta.san > 0 });
        if (delta.san < 0) lostSan = true;
      }
      if (delta.rep) {
        GameState.stats.rep = Math.max(0, Math.min(100, GameState.stats.rep + delta.rep));
        changes.push({ label: `${delta.rep > 0 ? '+' : ''}${delta.rep} 人脈`, color: delta.rep > 0 ? '#34d399' : '#fca5a5', box: 'box-rep', pos: delta.rep > 0 });
      }

      // SSR 媽祖乾兒子鎖血被動檢查
      let mazuSaved = false;
      if (GameState.stats.hp <= 0 && GameState.talent && GameState.talent.id === 'mazu_godson' && !GameState.flags.mazuShieldUsed) {
        GameState.flags.mazuShieldUsed = true;
        GameState.stats.hp = 20;
        mazuSaved = true;
        flashScreen('gold');
        SoundFX.gachaReveal(true);
        showToast('🏮 媽祖顯靈啦！一道金光護體，把你從鬼門關拉回來（體力鎖在 20）！', '✨');
        changes.push({ label: '媽祖保命！HP→20', color: '#fde047', box: 'box-hp', pos: true });
      }

      if (!silent) {
        changes.forEach((c, idx) => {
          setTimeout(() => spawnFloatingText(c.label, c.color, c.box, idx), idx * 90);
        });

        if (tookDamage && !mazuSaved) {
          SoundFX.damage();
          flashScreen('red');
          shakeScreen(delta.hp <= -30);
        } else if (gainedMoney) {
          SoundFX.coin();
          flashScreen('gold');
        } else if (lostSan) {
          SoundFX.sanDrop();
          flashScreen('purple');
          shakeScreen(false);
        } else if (changes.some(c => c.pos)) {
          SoundFX.click();
          flashScreen('green');
        }
      }

      updateHUD();

      // 檢查死亡條件
      let diedEndingId = null;
      if (GameState.stats.hp <= 0) {
        GameState.stats.hp = 0;
        updateHUD();
        if (deathCause === 'sandbar') diedEndingId = 'hidden_sandbar';
        else if (deathCause === 'sea') diedEndingId = 'hidden_sea';
        else if (deathCause === 'jail') diedEndingId = 'hidden_jail';
        else diedEndingId = 'n_youyinggong';
      } else if (GameState.stats.san <= 0) {
        diedEndingId = 'hidden_san';
      }

      return { changes, diedEndingId, mazuSaved };
    }

    function finalizeGachaDraw() {
      // 重置為該模式預設基礎數值再套用卡片加成
      const base = createInitialState(GameState.mode).stats;
      GameState.stats = { ...base };

      const origin = ORIGINS[Math.floor(Math.random() * ORIGINS.length)];
      // 天賦抽卡加權（SSR 約 16%）
      const pool = [
        TALENTS[0], // SSR
        TALENTS[1], TALENTS[1], // SR
        TALENTS[2], TALENTS[2], // R
        TALENTS[3], TALENTS[3], // R
        TALENTS[4], TALENTS[4], // N
        TALENTS[5]  // CURSED
      ];
      const talent = pool[Math.floor(Math.random() * pool.length)];

      GameState.origin = origin;
      GameState.talent = talent;

      // 套用開局加成
      const combineMods = {
        hp: (origin.mods?.hp || 0) + (talent.mods?.hp || 0),
        money: (origin.mods?.money || 0) + (talent.mods?.money || 0),
        san: (origin.mods?.san || 0) + (talent.mods?.san || 0),
        rep: (origin.mods?.rep || 0) + (talent.mods?.rep || 0)
      };

      GameState.stats.hp = Math.min(100, GameState.stats.hp + combineMods.hp);
      GameState.stats.money = Math.max(0, GameState.stats.money + combineMods.money);
      GameState.stats.san = Math.min(100, Math.max(10, GameState.stats.san + combineMods.san));
      GameState.stats.rep = Math.min(100, Math.max(0, GameState.stats.rep + combineMods.rep));

      SoundFX.gachaReveal(talent.rarity === 'SSR');
      if (talent.rarity === 'SSR') {
        flashScreen('gold');
        showToast('金光閃閃！歐皇降臨！抽到 SSR 媽祖乾兒子啦！', '🌟');
      } else if (talent.rarity === 'CURSED') {
        flashScreen('purple');
        showToast('抽到詛咒卡「路痴屬性」……希望你找得到臺灣在哪。', '🧭');
      } else {
        showToast(`開局身分：${origin.name}＋[${talent.rarity}] ${talent.name}！`, '🎴');

      updateHUD('階段 0：投胎抽卡完成');

      const area = $('gacha-stage-area');
      if (!area) return;
      area.innerHTML = `
        <div class="gacha-grid">

      `;

      let started = false;
      let finished = false;
      let clicks = 0;
      let startTime = 0;

      const startBtn = $('btn-mg-start');
      const bailBtn = $('btn-mg-bail');

      function handleKeyDown(e) {
        if (e.code === 'Space' && started && !finished) {
          e.preventDefault();
          registerBail();
        }
      }

      function registerBail() {
        if (!started || finished) return;
        clicks++;
        SoundFX.splash();
        bailBtn.classList.add('pressed');
        setTimeout(() => bailBtn.classList.remove('pressed'), 60);

        const pct = Math.min(100, (clicks / targetClicks) * 100);
        $('mg-count-text').textContent = `${clicks} / ${targetClicks} 下`;
        $('mg-water-bar').style.width = `${pct}%`;

        if (clicks % 4 === 0) {
          spawnFloatingText('💦 舀水!', '#7dd3fc', null, 0);
        }

        if (clicks >= targetClicks) {
          finishMiniGame(true);
        }
      }

      function finishMiniGame(success) {
        if (finished) return;
        finished = true;
        if (activeMiniGameTimer) {
          clearInterval(activeMiniGameTimer);
          activeMiniGameTimer = null;
        }
        window.removeEventListener('keydown', handleKeyDown);

            diedEndingId: res.diedEndingId

          renderOutcomeCard({
            artHtml: SceneArt.seaStorm('船艙進水大慘劇！'),
            title: '🌊 糟糕！舀水太慢，船艙嚴重進水！',
            narrative: `你只舀了 ${clicks} 下（差了 ${targetClicks - clicks} 下）！巨浪把你沖得七葷八素，喝了三大口鹹到爆的黑水溝海水，差點就原地去見龍王！`,
            changes: res.changes,

            toastEmoji: '🌊',
            nextLabel: '狼狽漂向臺灣海岸 ▶',
            onNext: renderStage1C_Landing,
            diedEndingId: res.diedEndingId
          });
        }
      }

      startBtn.addEventListener('click', () => {
        SoundFX.click();
        started = true;
        startBtn.style.display = 'none';
        bailBtn.style.display = 'flex';
        $('mg-status').textContent = '🌊 狂風暴雨！快狂點舀水！';
        startTime = performance.now();
        window.addEventListener('keydown', handleKeyDown);
        shakeScreen(false);

        activeMiniGameTimer = setInterval(() => {
          const elapsed = (performance.now() - startTime) / 1000;
          const remain = Math.max(0, totalDuration - elapsed);
          $('mg-time-text').textContent = `${remain.toFixed(1)} 秒`;
          $('mg-time-bar').style.width = `${(remain / totalDuration) * 100}%`;

          if (remain <= 0) {
            finishMiniGame(clicks >= targetClicks);
          }
        }, 50);
      });

      // 使用 pointerdown 讓手機觸控與滑鼠點擊皆零延遲反應
      bailBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        registerBail();
      });
    }

          artHtml: SceneArt.conflict('血戰庄頭'),
          title: '🔱 激戰三天三夜，兩敗俱傷！',
          narrative: `你跟著同鄉死守庄頭，雖然最後逼退了${rival}、贏得全庄敬重，但看著被燒毀的農田與受傷的鄉親，你才體會到「分類械鬥」其實沒有真正的贏家……`,
          changes: res.changes,
          toastMsg: '打贏了面子，輸掉了農田與 HP！',
          toastEmoji: '⚔️',
          nextLabel: '更大的時代巨浪來襲 ▶',
          onNext: renderStage3B_Rebellion,
          diedEndingId: res.diedEndingId
        });
      });

      $('c-mediate').addEventListener('click', () => {
        const freeByRep = GameState.stats.rep >= 50;
        const res = applyStatChanges({ money: freeByRep ? 0 : -30, rep: 25, san: 18 });
        renderOutcomeCard({
          artHtml: SceneArt.temple('和平調解成功'),
          title: '🕊️ 和談成功！化解一場流血悲劇！',
          narrative: freeByRep
            ? '你憑著超高人脈，邀集雙方長老在廟前擺下和解酒，講明「打壞水圳大家一起餓死」的道理，成功平息了這場械鬥！'
            : '你自掏腰包請雙方頭人吃飯談判並重劃水源分配，成功化解血光之災，兩邊庄頭都稱讚你是真・和平大使！',
          changes: res.changes,
          toastMsg: '用嘴砲跟智慧止戰，這才是高階玩家！',
          toastEmoji: '🕊️',
          nextLabel: '更大的時代巨浪來襲 ▶',
          onNext: renderStage3B_Rebellion,
          diedEndingId: res.diedEndingId
        });
      });

      $('c-hide').addEventListener('click', () => {
        const delta = isSanLow ? { rep: -15, san: -12, hp: -5 } : { rep: -15, money: -10, hp: 5 };
        const res = applyStatChanges(delta);
        renderOutcomeCard({
          artHtml: SceneArt.frontier('暫避鋒頭'),
          title: '🏃 平安躲過戰火，但被同鄉碎念了好久',
          narrative: '你帶著乾糧躲到平息才回庄，雖然被熱血的鄰居嫌不夠義氣，但摸摸自己完好無缺的手腳，覺得活著真好。',
          changes: res.changes,
          toastMsg: '留得青山在，不怕沒柴燒！',
          toastEmoji: '🫣',
          nextLabel: '更大的時代巨浪來襲 ▶',
          onNext: renderStage3B_Rebellion,
          diedEndingId: res.diedEndingId
        });
      });
    }

    /**
     * 階段 3-2：時代大民變（鴨母王朱一貴 / 天地會林爽文）
     */
    function renderStage3B_Rebellion() {
      updateHUD('階段 3：大時代民變 (2/3)');
      GameState.learnedTags.add('rebellion');

      const isZhu = GameState.mode === 'elementary' || GameState.flags.rebellionType === 'zhuyigui';
      const eventName = isZhu ? '鴨母王「朱一貴事件」' : '天地會「林爽文事件」';
      const storyDetail = isZhu
        ? '清廷官吏貪汙收重稅，民怨沸騰！高雄內門的養鴨戶<strong>朱一貴</strong>（人稱「鴨母王」，傳說鴨子都會聽他排隊！）揭竿起義，短短幾天就攻下臺灣府城自稱「中興王」！全臺瞬間大震動！'
        : '清廷官府貪腐橫行，秘密結社「天地會」首領<strong>林爽文</strong>在彰化發動清代臺灣規模最大的民變！全臺戰火四起，連乾隆皇帝都急派大將福康安渡海平亂！';

      $('game-root').innerHTML = `
        <div class="game-panel">
          ${SceneArt.conflict(`階段 3-2：${eventName}`)}
          <h2 class="event-title">🔥 「三年一小反，五年一大反」：${eventName}！</h2>
          <div class="event-story">${storyDetail}<br><br>動盪的大時代來了，你必須做出關鍵抉擇！</div>
          <div class="choices-list">
            <button class="choice-btn" id="c-reb-join" type="button">
              <div class="choice-title">
                <span>🚩 加入起義軍，跟著推翻貪官汙吏！</span>
                <span class="cost-badge risk">極高風險・小心遭清軍秋後算帳</span>
              </div>
              <div class="choice-hint">「王侯將相寧有種乎！」但歷史上這場民變最後可是被平定了喔……</div>
            </button>

            <button class="choice-btn" id="c-reb-yimin" type="button">
              <div class="choice-title">
                <span>🛡️ 加入「義民軍」保衛自己的家園與庄頭！</span>
                <span class="cost-badge good">體力 -20・人脈 +32・銀兩 +25</span>
              </div>
              <div class="choice-hint">${GameState.origin.id === 'hakka' ? '展現客家族群保鄉衛土的「義民」精神！' : '不分官民，先保護自家農田與鄉親不被波及！'}</div>
            </button>

            <button class="choice-btn" id="c-reb-popcorn" type="button">
              <div class="choice-title">
                <span>🍿 屯好米糧關緊大門，當個專業吃瓜群眾</span>
                <span class="cost-badge">花費 20 銀兩買糧・安全度過</span>
              </div>
              <div class="choice-hint">不站隊、不出頭，每天聽八卦等亂事結束！</div>
            </button>
          </div>
        </div>
      `;

      $('c-reb-join').addEventListener('click', () => {
        GameState.flags.joinedRebellion = true;
        // 歷史因果：朱一貴與林爽文最終皆被清軍平定，硬核模式懲罰更重
        const hpHit = GameState.mode === 'elementary' ? -30 : -46;
        const res = applyStatChanges({ hp: hpHit, money: -20, rep: -20, san: -15 }, { deathCause: 'jail' });
        renderOutcomeCard({
          artHtml: SceneArt.conflict('清軍大軍壓境平亂！'),
          title: '⛓️ 起義軍迅速潰敗，你差點被官兵抓去砍頭！',
          narrative: res.diedEndingId
            ? '清廷大軍登陸後勢如破竹，起義軍節節敗退，你逃跑不及遭到官兵圍捕，下半輩子只能在府城大牢度過……'
            : '起義軍內部很快就因意見分歧瓦解，清軍大舉搜捕！你丟光所有戰利品、連滾帶爬逃進深山躲了半年才保住一條小命！',
          changes: res.changes,
          toastMsg: '沒讀歷史課本齁？這兩場民變最後都被平定了！',
          toastEmoji: '⛓️',
          nextLabel: '迎接人生最後一章 ▶',
          onNext: renderStage3C_FinalTurn,
          diedEndingId: res.diedEndingId
        });
      });

      $('c-reb-yimin').addEventListener('click', () => {
        GameState.flags.becameYimin = true;
        const res = applyStatChanges({ hp: -20, rep: 32, money: 25, san: 10 });
        renderOutcomeCard({
          artHtml: SceneArt.temple('忠義雙全・獲頒「褒忠」匾額'),
          title: '🛡️ 守住家園！鄉親尊稱你為「義民英雄」！',
          narrative: '你組織鄉勇巡邏守衛庄頭，成功擋下趁火打劫的亂兵！亂事平息後，鄉親集資答謝你，官府更賜下「褒忠」榮譽，你的名望直衝雲霄！',
          changes: res.changes,
          toastMsg: '保家衛國義民魂，歷史留名啦！',
          toastEmoji: '🛡️',
          nextLabel: '迎接人生最後一章 ▶',
          onNext: renderStage3C_FinalTurn,
          diedEndingId: res.diedEndingId
        });
      });

      $('c-reb-popcorn').addEventListener('click', () => {
        const pay = Math.min(GameState.stats.money, 20);
        const res = applyStatChanges({ money: -pay, san: -5, hp: 5 });
        renderOutcomeCard({
          artHtml: SceneArt.temple('安穩度過亂世'),
          title: '🍿 亂世吃瓜大師，毫髮無傷！',
          narrative: '戰火期間物價飛漲，但你早就買好滿滿一缸白米躲在家裡，等官兵平定動亂後再淡定開門，堪稱亂世生存教科書！',
          changes: res.changes,
          toastMsg: '吃瓜群眾永遠活到最後一集！',
          toastEmoji: '🍿',
          nextLabel: '迎接人生最後一章 ▶',
          onNext: renderStage3C_FinalTurn,
          diedEndingId: res.diedEndingId
        });
      });
    }

    /**
     * 階段 3-3：落地生根（從唐山祖轉向開臺祖）
     */
    function renderStage3C_FinalTurn() {
      updateHUD('階段 3：落地生根 (3/3)');
      GameState.learnedTags.add('ancestor_shift');
      const isJunior = GameState.mode === 'junior';

      $('game-root').innerHTML = `
        <div class="game-panel">
          ${SceneArt.temple('階段 3-3：歲月流轉・落地生根')}
          <h2 class="event-title">🏛️ 數十年過去，你對臺灣的認同改變了⋯⋯</h2>
          <div class="event-story">
            ${isJunior
              ? '隨著清廷逐漸放寬渡臺禁令，移民社會從動盪走向穩定。你的事業與生活全在臺灣，這時鄉親問你：要花錢繼續合資祭祀原鄉的<strong>「唐山祖」</strong>，還是在臺灣建立自家宗祠、落地生根成為後代祭拜的<strong>「開臺祖」</strong>？'
              : '經歷了黑水溝巨浪、開墾農田與大時代的風雨，你已經在臺灣生活了好長一段時間，看著眼前翠綠的稻田與熱情的鄉親，你決定怎麼規劃人生的下半場？'}
          </div>
          <div class="choices-list">
            <button class="choice-btn" id="c-final-ancestor" type="button" ${GameState.stats.money < 25 ? 'disabled' : ''}>
              <div class="choice-title">
                <span>🏛️ 在臺灣建宗祠、娶妻生子，立志成為「開臺祖」！</span>
                <span class="cost-badge good">銀兩 -25・人脈 +20・理智 +20</span>
              </div>
              <div class="choice-hint">從唐山過客徹底化為臺灣主人（本土化轉型）！${GameState.stats.money < 25 ? '（銀兩不足）' : ''}</div>
            </button>

            <button class="choice-btn" id="c-final-biz" type="button">
              <div class="choice-title">
                <span>💰 把所有心力投入商行與田產，拼成全臺首富！</span>
                <span class="cost-badge">銀兩 +35・體力 -10</span>
              </div>
              <div class="choice-hint">「別跟我談感情，我只在乎倉庫裡的銀兩！」</div>
            </button>

            <button class="choice-btn" id="c-final-chill" type="button">
              <div class="choice-title">
                <span>🍵 退隱鄉間喝茶種菜，享受安穩退休人生</span>
                <span class="cost-badge good">體力 +20・理智 +15</span>
              </div>
              <div class="choice-hint">平平安安走到終點，就是最強的生存贏家！</div>
            </button>
          </div>
        </div>
      `;

      $('c-final-ancestor').addEventListener('click', () => {
        const res = applyStatChanges({ money: -25, rep: 20, san: 20 });
        if (res.diedEndingId) return renderStage4Ending(res.diedEndingId);
        renderStage4Ending(evaluateSurvivalEnding(true));
      });

      $('c-final-biz').addEventListener('click', () => {
        const res = applyStatChanges({ money: 35, hp: -10 });
        if (res.diedEndingId) return renderStage4Ending(res.diedEndingId);
        renderStage4Ending(evaluateSurvivalEnding(false));
      });

      $('c-final-chill').addEventListener('click', () => {
        const res = applyStatChanges({ hp: 20, san: 15 });
        if (res.diedEndingId) return renderStage4Ending(res.diedEndingId);
        renderStage4Ending(evaluateSurvivalEnding(false));
      });
    }

    /* ==========================================================================
       11. 階段 4：結局判定、本地圖鑑存檔與「歷史真相解密」
       ========================================================================== */
    function evaluateSurvivalEnding(choseAncestor) {
      const { hp, money, rep } = GameState.stats;
      if (GameState.flags.investedCanal && money >= 115) return 'ssr_canal';
      if ((choseAncestor && rep >= 55 && money >= 50) || (rep >= 65 && money >= 85 && hp >= 35)) return 'ssr_ancestor';
      if (GameState.flags.becameYimin && rep >= 60) return 'sr_yimin';
      if (money >= 95) return 'sr_tycoon';
      if (money < 35 || rep < 30 || (GameState.talent && GameState.talent.id === 'luohanjiao_body' && rep < 45)) return 'r_luohanjiao';
      return 'r_farmer';
    }

    function pickThreeHistoricalFacts() {
      const tags = Array.from(GameState.learnedTags);
      // 補齊至少 3 條不重複重點
      const fallbackOrder = ['black_ditch', 'ban_three', 'canal_water', 'tuniugou', 'xiedou', 'rebellion', 'ancestor_shift', 'beliefs'];
      for (const t of fallbackOrder) {
        if (tags.length >= 3) break;
        if (!tags.includes(t)) tags.push(t);
      }
      // 優先挑選最新經歷的 3 條
      const chosen = tags.slice(-3);
      return chosen.map(k => HISTORY_FACTS[k]).filter(Boolean);
    }

    function renderStage4Ending(endingId) {
      GameState.stage = 4;
      updateHUD('階段 4：人生結算完成');
      const ending = ENDINGS[endingId] || ENDINGS.r_farmer;
      const isDeath = ending.rarity === 'CURSED' || endingId === 'n_youyinggong';
      const isNewUnlock = Storage.unlock(ending.id);

      if (isDeath) {
        SoundFX.gameover();
        flashScreen('red');
      } else {
        SoundFX.victory();
        flashScreen('gold');
      }

      showToast(ending.toast, ending.emoji);

      const facts = pickThreeHistoricalFacts();
      const unlockedCount = Storage.getUnlocked().length;
      const totalEndings = Object.keys(ENDINGS).length;

      $('game-root').innerHTML = `
        <div class="game-panel" style="text-align:center;">
          <div style="font-size:0.88rem; font-weight:800; color:#93c5fd; margin-bottom:8px;">
            ${isDeath ? '💀 生存挑戰結束・歷史留下一聲嘆息' : '🎉 恭喜存活！清代臺灣求生結算'}
            ${isNewUnlock ? '<span style="background:#f59e0b; color:#090d16; padding:2px 8px; border-radius:999px; margin-left:6px;">NEW 圖鑑解鎖!</span>' : ''}
          </div>

          <div class="gacha-card rarity-${ending.rarity}" style="max-width:440px; margin:0 auto 16px;">
            <div class="gacha-inner" style="padding:22px 18px;">
              <span class="rarity-badge">[${ending.rarity}] ${ending.tag}</span>
              <div class="card-emoji" style="font-size:3.8rem;">${ending.emoji}</div>
              <div class="card-name" style="font-size:1.5rem; margin-bottom:4px;">${ending.title}</div>
              <div class="card-desc" style="font-size:0.95rem; color:#f1f5f9;">${ending.desc}</div>
              <div class="card-effect" style="margin-top:12px; color:#93c5fd;">
                最終數值：❤️ ${GameState.stats.hp} ｜ 💰 ${GameState.stats.money}兩 ｜ 🧠 ${GameState.stats.san} ｜ 🤝 ${GameState.stats.rep}
              </div>
            </div>
          </div>

          <!-- 知識小彩蛋：3 句話歷史真相解密 -->
          <div class="history-egg">
            <h4>📚 歷史真相解密（你剛剛親身經歷的 108 課綱重點！）</h4>
            <ul>
              ${facts.map(f => `<li>${f}</li>`).join('')}
            </ul>
          </div>

          <div class="btn-row">
            <button id="btn-replay" class="btn btn-gold" type="button">🔄 同難度再渡一次黑水溝</button>
            <button id="btn-end-gallery" class="btn btn-purple" type="button">📖 查看圖鑑 (${unlockedCount}/${totalEndings})</button>
          </div>
          <button id="btn-back-home" class="btn btn-slate" type="button" style="margin-top:10px;">
            🏠 回主畫面切換難度模式
          </button>
        </div>
      `;

      $('btn-replay').addEventListener('click', () => {
        SoundFX.click();
        startNewGame(GameState.mode);
      });
      $('btn-end-gallery').addEventListener('click', () => {
        SoundFX.click();
        openGalleryModal();
      });
      $('btn-back-home').addEventListener('click', () => {
        SoundFX.click();
        renderHome();
      });
    }

    /* ==========================================================================
       12. 成就圖鑑 Modal 邏輯
       ========================================================================== */
    function updateGalleryCounter() {
      const unlocked = Storage.getUnlocked();
      const total = Object.keys(ENDINGS).length;
      $('gallery-count-top').textContent = `${unlocked.length}/${total}`;
      $('gallery-progress-text').textContent = `${unlocked.length} / ${total} (${Math.round((unlocked.length / total) * 100)}%)`;
      $('gallery-bar-fill').style.width = `${(unlocked.length / total) * 100}%`;
    }

    function openGalleryModal() {
      const unlocked = Storage.getUnlocked();
      updateGalleryCounter();
      const grid = $('gallery-grid');
      grid.innerHTML = Object.values(ENDINGS).map(end => {
        const has = unlocked.includes(end.id);
        return `
          <div class="gallery-item ${has ? 'unlocked' : 'locked'}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:1.7rem;">${has ? end.emoji : '❓'}</span>
              <span class="mini-tag ${end.rarity.toLowerCase()}">[${end.rarity}] ${end.tag}</span>
            </div>
            <div style="font-weight:900; font-size:0.98rem; color:${has ? '#fde68a' : '#94a3b8'};">
              ${has ? end.title : '尚未解鎖結局'}
            </div>
            <div style="font-size:0.8rem; color:#cbd5e1;">
              ${has ? end.desc : '繼續挑戰不同選擇與死法，收集 100% 渡臺圖鑑！'}
            </div>
          </div>
        `;
      }).join('');

      $('gallery-modal').classList.add('open');
    }

    function closeGalleryModal() {
      $('gallery-modal').classList.remove('open');
    }

    /* ==========================================================================
       13. 頂部全域按鈕綁定與啟動
       ========================================================================== */
    function initApp() {
      updateGalleryCounter();

      $('btn-mute').addEventListener('click', () => {
        const muted = SoundFX.toggleMute();
        $('btn-mute').textContent = muted ? '🔇 靜音中' : '🔊 音效開';
      });

      $('btn-gallery-top').addEventListener('click', () => {
        SoundFX.click();
        openGalleryModal();
      });

      $('btn-close-gallery').addEventListener('click', () => {
        SoundFX.click();
        closeGalleryModal();
      });

      $('gallery-modal').addEventListener('click', (e) => {
        if (e.target === $('gallery-modal')) closeGalleryModal();
      });

      $('btn-reset-gallery').addEventListener('click', () => {
        SoundFX.click();
        $('confirm-modal').classList.add('open');
      });

      $('btn-confirm-cancel').addEventListener('click', () => {
        SoundFX.click();
        $('confirm-modal').classList.remove('open');
      });

      $('btn-confirm-ok').addEventListener('click', () => {
        SoundFX.damage();
        Storage.clear();
        $('confirm-modal').classList.remove('open');
        openGalleryModal();
        showToast('圖鑑紀錄已清空，重新展開收集之旅！', '🗑️');
        if (!GameState) renderHome();
      });

      $('btn-home').addEventListener('click', () => {
        SoundFX.click();
        renderHome();
      });

      renderHome();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
